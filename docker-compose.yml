version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: smart_checkout_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # FastAPI AI Recognition Service (YOLO + OCR + VLM + FAISS)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smart_checkout_ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./ai-service/uploads:/app/uploads
      - ./ai-service/outputs:/app/outputs
      - ./ai-service/crops:/app/crops

  # Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_checkout_backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/ai_smart_checkout
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
      - ai-service

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_checkout_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
